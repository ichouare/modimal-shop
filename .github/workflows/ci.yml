## font end  continuous integration workflow
name : font end ci workflow

env:
  NODE_ENV: "production"
  NODE_VERSION: 24.14.0
on:
  push:
    branches:
      - main
jobs:
  quality-checks:
    name:  Quality Checks
    runs-on: ubuntu-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v3

      - name: steps node js
        uses: actions/setup-node@v3
        with:
           node-version: ${{ env.NODE_VERSION }}
           cache: npm # add this to avoid  reinstalling deps everything every time workflow is runing

      - name: install deps
        # use npm ci instead of npm i because with command we can clean first and install
        run:  npm ci
        working-directory: .

      - name: check linting
        run : npm run lint
        working-directory: .

      - name: build app
        run:  npm run build

  security-audit:


      name:   security Audit
      runs-on: ubuntu-latest

      steps:

        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION}}
            cache: npm

        - name: Install Dependencies
          run: npm ci

        - name: NPM Audit
          run:  npm audit --audit-level=high
          working-directory: .



  deploy:
      name: deploy app
      needs: [  quality-checks ,   security-audit]
      runs-on: ubuntu-latest
      environment:
        name: production
      if: github.ref == 'refs/heads/main' # Run this job ONLY if the workflow was triggered from the main branch
      steps:

        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Deploy Application
          run: echo "Deploy step here"


